name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lean-sys dependency
        run: git clone https://github.com/Th0rgal/lean-sys.git ../lean-sys && git -C ../lean-sys checkout 9a3fda9180d8e9a2e429ca38046b74467f68866b
      - name: Install Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Turbo Lean incremental build
        uses: Th0rgal/turbo-lean@f4887f20fed88a4945b607fafc249e1d39af4ddf
        with:
          project-dir: "."
          command: build
          seed-shards: "true"
          mode: trusted
      - name: Build
        run: lake build
      - name: Zero-Trust Spec Audit (turbo-lean)
        run: |
          turbo-lean --json audit-spec LeanAV/Spec.lean
          turbo-lean --json audit-spec LeanAV/Domain.lean
          turbo-lean --json audit-spec LeanAV/PlanIR.lean
          turbo-lean --json audit-spec LeanAV/NativeKernels.lean
      - name: Self-test & C-ABI / Kernel Verification
        run: |
          .lake/build/bin/lffmpeg self-test
          .lake/build/bin/lffmpeg verify-ffi
          .lake/build/bin/lffmpeg verify-kernels
      - name: Axiom audit
        run: lake env lean scripts/check_axioms.lean
      - name: Unit & Differential Test Suite
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 -m unittest discover -s tests/differential -p "test_phase*.py"
          python3 -m unittest discover -s tests/differential -p "test_quorum*.py"
      - name: CLI smoke tests
        run: |
          set +e
          touch /tmp/existing.mp4
          .lake/build/bin/lffmpeg -n -i /dev/null /tmp/existing.mp4
          test $? -ne 0
          .lake/build/bin/lffmpeg -i /dev/null -c:v vp9 /tmp/rejected.mp4
          test $? -ne 0
          .lake/build/bin/lffmpeg -i /dev/null -f null /tmp/rejected.mp4
          test $? -ne 0

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lean-sys dependency
        run: git clone https://github.com/Th0rgal/lean-sys.git ../lean-sys && git -C ../lean-sys checkout 9a3fda9180d8e9a2e429ca38046b74467f68866b
      - run: brew install ffmpeg
      - name: Patch lean-sys socket portability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('../lean-sys/c/lean_sys_shim.c')
          s = p.read_text()
          s = s.replace('int fd = socket(AF_INET, SOCK_STREAM | SOCK_CLOEXEC, 0), one = 1;', 'int fd = socket(AF_INET, SOCK_STREAM, 0), one = 1;')
          s = s.replace('accept4((int)lfd, NULL, NULL, SOCK_CLOEXEC)', 'accept((int)lfd, NULL, NULL)')
          p.write_text(s)
          PY
      - name: Install Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake build
      - run: .lake/build/bin/lffmpeg self-test
      - run: .lake/build/bin/lffmpeg verify-ffi
      - run: .lake/build/bin/lffmpeg verify-kernels
