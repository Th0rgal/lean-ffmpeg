name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lean-sys dependency
        run: git clone https://github.com/Th0rgal/lean-sys.git ../lean-sys && git -C ../lean-sys checkout 9a3fda9180d8e9a2e429ca38046b74467f68866b
      - name: Install Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg runtime and libav headers
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libavformat-dev libavcodec-dev libswresample-dev libavutil-dev clang
      - name: Build
        run: lake build
      - name: Install & cache turbo-lean
        uses: Th0rgal/turbo-lean@69a8d1929170dd3510f864c342fcec0d1c390f5e
        with:
          project-dir: "."
          command: cache-only
      - name: Zero-Trust Spec Audit across all LeanAV modules (turbo-lean)
        run: |
          python3 - <<'PY'
          import glob, json, subprocess, sys
          for path in sorted(glob.glob("LeanAV/*.lean")):
              res = subprocess.run(["turbo-lean", "--json", "audit-spec", path], capture_output=True, text=True, check=True)
              data = json.loads(res.stdout)
              print(f"{path}: audited={data['total_specs_audited']} tight={data['tight_specs']} vacuous={data['vacuous_specs']} trivial={data['trivial_specs']}")
              if not data.get("ok") or data.get("vacuous_specs", 0) != 0 or data.get("trivial_specs", 0) != 0:
                  sys.exit(1)
          PY
      - name: Self-test & C-ABI / LNIR Kernel Verification
        run: |
          .lake/build/bin/lffmpeg self-test
          .lake/build/bin/lffmpeg verify-ffi
          .lake/build/bin/lffmpeg verify-kernels
      - name: Axiom audit
        run: lake env lean scripts/check_axioms.lean
      - name: Unit & Differential Test Suite
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 -m unittest discover -s tests/differential -p "test_*.py"
      - name: CLI smoke tests
        run: |
          set +e
          touch /tmp/existing.mp4
          .lake/build/bin/lffmpeg -n -i /dev/null /tmp/existing.mp4
          test $? -ne 0
          .lake/build/bin/lffmpeg -i /dev/null -c:v vp9 /tmp/rejected.mp4
          test $? -ne 0
          .lake/build/bin/lffmpeg -i /dev/null -f null /tmp/rejected.mp4
          test $? -ne 0

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lean-sys dependency
        run: git clone https://github.com/Th0rgal/lean-sys.git ../lean-sys && git -C ../lean-sys checkout 9a3fda9180d8e9a2e429ca38046b74467f68866b
      - run: brew install ffmpeg
      - name: Patch lean-sys socket portability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('../lean-sys/c/lean_sys_shim.c')
          s = p.read_text()
          s = s.replace('int fd = socket(AF_INET, SOCK_STREAM | SOCK_CLOEXEC, 0), one = 1;', 'int fd = socket(AF_INET, SOCK_STREAM, 0), one = 1;')
          s = s.replace('accept4((int)lfd, NULL, NULL, SOCK_CLOEXEC)', 'accept((int)lfd, NULL, NULL)')
          p.write_text(s)
          PY
      - name: Install Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.31.0
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake build
      - run: .lake/build/bin/lffmpeg self-test
      - run: .lake/build/bin/lffmpeg verify-ffi
      - run: .lake/build/bin/lffmpeg verify-kernels
      - name: Axiom audit
        run: lake env lean scripts/check_axioms.lean
      - name: Unit & Differential Test Suite
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 -m unittest discover -s tests/differential -p "test_*.py"
