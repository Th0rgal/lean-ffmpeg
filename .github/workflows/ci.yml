name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      TURBO_LEAN_NO_DAEMON: "1"
      TURBO_LEAN_MODULE_TIMEOUT_SECS: "3600"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lean-sys dependency
        run: git clone https://github.com/Th0rgal/lean-sys.git ../lean-sys && git -C ../lean-sys checkout 077775ba387f1eeb2976cb8763b4633b8d5ce313
      - name: Install Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install clang and strace (no libav, no ffmpeg yet)
        run: sudo apt-get update && sudo apt-get install -y clang strace && sudo rm -f /usr/bin/ffmpeg /usr/bin/ffprobe /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
      - name: Install & cache turbo-lean
        uses: Th0rgal/turbo-lean@dc1656dc948f1d7bfc25d165575ae3819a2e8b97
        with:
          project-dir: "."
          command: cache-only
      - name: Restore turbo-lean CAS and lean-sys build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/turbo-lean
            ../lean-sys/.lake/build
          key: turbo-lean-postbuild-${{ runner.os }}-${{ hashFiles('LeanAV/**', 'scripts/build_turbo.py', 'c/**') }}
          restore-keys: |
            turbo-lean-postbuild-${{ runner.os }}-
      - name: Remove elan lake so the build cannot fall back to it
        run: |
          rm -f "$HOME/.elan/bin/lake" "$HOME/.elan/toolchains/"*/bin/lake
          ! command -v lake
      - name: Build
        run: python3 scripts/build_turbo.py
        env:
          LEAN_PATH: .lake/build/lib/lean:../lean-sys/.lake/build/lib/lean
          TURBO_LEAN_EMIT_C: "1"
      - name: Zero-Trust Spec Audit across all LeanAV modules (turbo-lean)
        run: |
          python3 - <<'PY'
          import glob, json, subprocess, sys
          total_audited = 0
          total_tight = 0
          for path in sorted(glob.glob("LeanAV/*.lean")):
              res = subprocess.run(["turbo-lean", "--json", "audit-spec", path], capture_output=True, text=True, check=True)
              data = json.loads(res.stdout)
              audited = data["total_specs_audited"]
              tight = data["tight_specs"]
              vacuous = data.get("vacuous_specs", 0)
              trivial = data.get("trivial_specs", 0)
              shadowed = len(data.get("shadowed_constants", []))
              total_audited += audited
              total_tight += tight
              print(f"{path}: ok={data.get('ok')} audited={audited} tight={tight} vacuous={vacuous} trivial={trivial} shadowed={shadowed}")
              if not data.get("ok") or vacuous != 0 or trivial != 0 or shadowed != 0 or tight != audited:
                  sys.exit(1)
          print(f"Total: {total_tight}/{total_audited} non_vacuous_and_tight")
          if total_audited != 890 or total_tight != 890:
              sys.exit(1)
          PY
      - name: LNIR wire & outer-shell zero-drift check
        run: ./scripts/regen_lnir_c_kernels.sh --check-ir
      - name: Self-test & C-ABI / LNIR Kernel Verification
        run: |
          .lake/build/bin/lffmpeg self-test
          .lake/build/bin/lffmpeg verify-ffi
          .lake/build/bin/lffmpeg verify-kernels
      - name: Axiom audit
        run: |
          out="$(LEAN_PATH='.lake/build/lib/lean:../lean-sys/.lake/build/lib/lean' lean scripts/check_axioms.lean 2>&1)"
          echo "$out"
          echo "$out" | grep -Fq "Verified 24910 LeanAV declarations (0 sorryAx, 0 custom axioms)."
      - name: Zero-FFmpeg Standalone Suite
        run: |
          ! command -v ffmpeg
          ! command -v ffprobe
          python3 -m unittest discover -s tests -p "test_*.py"
      - name: Install reference ffmpeg oracle (FFmpeg 8.1+ ships AV1 ITU-T T.35 Dolby Vision EMDF decode)
        run: |
          mkdir -p "$HOME/.local/ffmpeg"
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
            -o /tmp/ffmpeg-oracle.tar.xz
          tar -xJf /tmp/ffmpeg-oracle.tar.xz -C "$HOME/.local/ffmpeg" --strip-components=1
          echo "$HOME/.local/ffmpeg/bin" >> "$GITHUB_PATH"
          "$HOME/.local/ffmpeg/bin/ffmpeg" -version | head -n 2
      - name: Differential oracle suite
        run: |
          python3 - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("tests/differential", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
      - name: CLI smoke tests
        run: |
          set +e
          touch /tmp/existing.mp4
          .lake/build/bin/lffmpeg -n -i /dev/null /tmp/existing.mp4
          test $? -ne 0
          .lake/build/bin/lffmpeg -i /dev/null -c:v vp9 /tmp/rejected.mp4
          test $? -ne 0
          .lake/build/bin/lffmpeg -i /dev/null -f null /tmp/rejected.mp4
          test $? -ne 0

  macos:
    runs-on: macos-15
    env:
      TURBO_LEAN_NO_DAEMON: "1"
      TURBO_LEAN_MODULE_TIMEOUT_SECS: "3600"
      TURBO_LEAN_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lean-sys dependency
        run: git clone https://github.com/Th0rgal/lean-sys.git ../lean-sys && git -C ../lean-sys checkout 077775ba387f1eeb2976cb8763b4633b8d5ce313
      - name: Patch lean-sys macOS SOCK_CLOEXEC portability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('../lean-sys/c/lean_sys_shim.c')
          s = p.read_text()
          s = s.replace('socket(AF_INET, SOCK_STREAM | SOCK_CLOEXEC, 0)', 'socket(AF_INET, SOCK_STREAM, 0)')
          p.write_text(s)
          PY
      - name: Install Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install & cache turbo-lean
        uses: Th0rgal/turbo-lean@dc1656dc948f1d7bfc25d165575ae3819a2e8b97
        with:
          project-dir: "."
          command: cache-only
          cache-key-prefix: turbo-lean-cas-macos
      - name: Restore turbo-lean CAS and lean-sys build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/turbo-lean
            ../lean-sys/.lake/build
          key: turbo-lean-postbuild-${{ runner.os }}-${{ hashFiles('LeanAV/**', 'scripts/build_turbo.py', 'c/**') }}
          restore-keys: |
            turbo-lean-postbuild-${{ runner.os }}-
      - name: Remove elan lake so the build cannot fall back to it
        run: |
          rm -f "$HOME/.elan/bin/lake" "$HOME/.elan/toolchains/"*/bin/lake
          ! command -v lake
      - name: Build
        run: python3 scripts/build_turbo.py
        env:
          LEAN_PATH: .lake/build/lib/lean:../lean-sys/.lake/build/lib/lean
          TURBO_LEAN_EMIT_C: "1"
      - name: Zero-Trust Spec Audit across all LeanAV modules (turbo-lean)
        run: |
          python3 - <<'PY'
          import glob, json, subprocess, sys
          total_audited = 0
          total_tight = 0
          for path in sorted(glob.glob("LeanAV/*.lean")):
              res = subprocess.run(["turbo-lean", "--json", "audit-spec", path], capture_output=True, text=True, check=True)
              data = json.loads(res.stdout)
              audited = data["total_specs_audited"]
              tight = data["tight_specs"]
              vacuous = data.get("vacuous_specs", 0)
              trivial = data.get("trivial_specs", 0)
              shadowed = len(data.get("shadowed_constants", []))
              total_audited += audited
              total_tight += tight
              print(f"{path}: ok={data.get('ok')} audited={audited} tight={tight} vacuous={vacuous} trivial={trivial} shadowed={shadowed}")
              if not data.get("ok") or vacuous != 0 or trivial != 0 or shadowed != 0 or tight != audited:
                  sys.exit(1)
          print(f"Total: {total_tight}/{total_audited} non_vacuous_and_tight")
          if total_audited != 890 or total_tight != 890:
              sys.exit(1)
          PY
      - name: LNIR wire & outer-shell zero-drift check
        run: ./scripts/regen_lnir_c_kernels.sh --check-ir
      - run: .lake/build/bin/lffmpeg self-test
      - run: .lake/build/bin/lffmpeg verify-ffi
      - run: .lake/build/bin/lffmpeg verify-kernels
      - name: Axiom audit
        run: |
          out="$(LEAN_PATH='.lake/build/lib/lean:../lean-sys/.lake/build/lib/lean' lean scripts/check_axioms.lean 2>&1)"
          echo "$out"
          echo "$out" | grep -Fq "Verified 24910 LeanAV declarations (0 sorryAx, 0 custom axioms)."
      - name: Zero-FFmpeg Standalone Suite
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as empty:
              dirs = [d for d in os.environ.get("PATH", "").split(":") if d and not (Path(d) / "ffmpeg").exists() and not (Path(d) / "ffprobe").exists()]
              env = dict(os.environ, PATH=":".join([empty, *dirs]))
              sys.exit(subprocess.call([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"], env=env))
          PY
      - name: Install reference ffmpeg oracle (ffmpeg-full ships libaom-av1)
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Differential oracle suite
        run: |
          python3 - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("tests/differential", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
